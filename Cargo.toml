[package]
name = "crewtui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small terminal UI framework built around state, messages, update and view."
license = "MIT OR Apache-2.0"
repository = "https://github.com/whoisclebs/crewtui"

[workspace]
members = ["crates/rich"]

[dependencies]
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[lib]
bench = false

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[[bench]]
name = "frame"
harness = false
