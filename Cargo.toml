[package]
name = "crewtui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small terminal UI framework built around state, messages, update and view."
license = "MIT OR Apache-2.0"
repository = "https://github.com/whoisclebs/crewtui"

[dependencies]
libc = "0.2.189"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
